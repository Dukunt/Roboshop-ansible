- name: creating instances and r53 records
  hosts: local
  connection: local
  vars:
   sg_id: "sg-0288bab500a44cfb0"
   ami_id: "ami-0055977a6e828a4f4"
   environ: "dev"
   zone_id: "harihara.fun"
  tasks:
   - name: create db instances
     amazon.aws.ec2_instance:
       instance_type: "t3.micro"
       security_group: "{{ sg_id }}"
       image_id: "{{ ami_id }}"
       name: "{{ item }}-{{ environ }}"
     loop:
      - frontend
      - mongo
     register: inst_op

   - name: print ec2 output
     ansible.builtin.debug:
      msg: "{{ inst_op }}" 

   - name: ceater53 records
     amazon.aws.route53:
      state: present
      zone: "{{ zone_id }}"
      record: "{{ item.item }}-{{ environ }}.{{ zone_id }}"  #frontend-dev.harihara.fun
      tye: A
      ttl: 1
      value: "{{ item.instances[0].private_ip_address }}"
      wait: true
     loop: "{{ inst_op.results  }}"
      
             

       
