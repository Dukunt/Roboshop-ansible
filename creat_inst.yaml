- name: creating instances
  hosts: local
  connection: local
  vars:
   sg_id: "sg-0288bab500a44cfb0"
   ami_id: "ami-0055977a6e828a4f4"
   environ: "dev"
   instances:
   - frontend
   - catalogue
  tasks:
   - name: create db instances
     amazon.aws.ec2_instance:
       instance_type: "t3.micro"
       security_group: "{{ sg_id }}"
       image_id: "{{ ami_id }}"
       name: "{{ item }}-{{ environ }}"
     loop: " {{ instances }} "
     register: inst_op

   - name: print ec2 output
     ansible.builtin.debug:
      msg: "{{ inst_op }}"   

       
